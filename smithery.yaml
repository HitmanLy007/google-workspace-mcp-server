# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['build/index.js'], env: { GOOGLE_CLIENT_ID: config.googleClientId, GOOGLE_CLIENT_SECRET: config.googleClientSecret, GOOGLE_REFRESH_TOKEN: config.googleRefreshToken } })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - googleClientId
      - googleClientSecret
      - googleRefreshToken
    properties:
      googleClientId:
        type: string
        description: Google OAuth client ID
      googleClientSecret:
        type: string
        description: Google OAuth client secret
      googleRefreshToken:
        type: string
        description: Google OAuth refresh token
  exampleConfig:
    googleClientId: YOUR_CLIENT_ID
    googleClientSecret: YOUR_CLIENT_SECRET
    googleRefreshToken: YOUR_REFRESH_TOKEN
